# EcoPoint Edu - demostración web (D17, tarea T04). Sin valores secretos.
services:
  - type: web
    name: ecopoint-edu-api
    runtime: docker
    plan: free
    region: ohio
    autoDeploy: false
    healthCheckPath: /api/v1/auth/csrf
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ECOPOINT_DB_URL
        sync: false
      - key: ECOPOINT_DB_USER
        sync: false
      - key: ECOPOINT_DB_PASSWORD
        sync: false
      - key: ECOPOINT_FRONTEND_ORIGIN
        sync: false

  - type: web
    name: ecopoint-edu
    runtime: static
    autoDeploy: false
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_USE_MOCK_API
        value: "false"
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ecopoint-edu-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
