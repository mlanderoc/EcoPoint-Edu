# EcoPoint Edu - configuración de la aplicación
# La conexión a PostgreSQL se lee de variables de entorno (spec 002, R-051).
# Nunca escribas aquí una contraseña real: defínela en tu computador con
#   setx ECOPOINT_DB_PASSWORD "tu_contraseña"   (PowerShell, una sola vez)
spring.application.name=ecopoint-edu

spring.datasource.url=${ECOPOINT_DB_URL:jdbc:postgresql://localhost:5432/ecopoint}
spring.datasource.username=${ECOPOINT_DB_USER:postgres}
spring.datasource.password=${ECOPOINT_DB_PASSWORD:}

# El esquema se crea con sql/001_schema.sql, no automáticamente al arrancar.
spring.sql.init.mode=never

spring.main.banner-mode=off

# Servidor web de la API REST (spec 003).
server.port=${PORT:8080}
# Sesión con cookie del servidor: 8 horas, HttpOnly y SameSite=Lax (T1, R-124).
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ECOPOINT_COOKIE_SECURE:false}
# Nunca se muestran trazas ni mensajes internos en las respuestas (R-112).
server.error.include-stacktrace=never
server.error.include-message=never

# Origen permitido del frontend para CORS; nunca '*' (R-127, T4).
ecopoint.frontend-origin=${ECOPOINT_FRONTEND_ORIGIN:http://localhost:5173}
# Carpeta local donde se guardan las fotos de evidencia (RN-090).
ecopoint.upload-dir=${ECOPOINT_UPLOAD_DIR:./uploads}
# Límite de tamaño de las fotos: 5 MB (RN-090).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Documentación OpenAPI y Swagger UI: apagadas salvo en el perfil dev (R-130, T13).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
