# Perfil de la demostración web (D17, tarea T03). Los valores secretos vienen de Render.
spring.datasource.url=${ECOPOINT_DB_URL}
spring.datasource.username=${ECOPOINT_DB_USER}
spring.datasource.password=${ECOPOINT_DB_PASSWORD}
ecopoint.frontend-origin=${ECOPOINT_FRONTEND_ORIGIN}

# Pocas conexiones y ninguna fija, para que Neon pueda dormirse cuando no hay uso.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# La aplicación corre detrás del proxy HTTPS de Render.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Almacenamiento temporal: la demostración no ofrece pantalla de evidencias.
ecopoint.upload-dir=${ECOPOINT_UPLOAD_DIR:/tmp/ecopoint-uploads}
